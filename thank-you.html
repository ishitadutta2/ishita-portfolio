<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="description" content="Thanks for reaching out — Ishita Dutta's portfolio.">
   <meta name="robots" content="noindex, follow">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <!--=============== FAVICON ===============-->
   <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">

   <!--=============== REMIXICONS ===============-->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css">

   <!--=============== CSS ===============-->
   <link rel="stylesheet" href="assets/css/styles.css">

   <title>Message Sent | Ishita Dutta</title>
</head>
<body>
   <main class="status-page">
      <div class="status-page__terminal">
         <div class="home__terminal-bar">
            <span class="home__terminal-dot home__terminal-dot--red"></span>
            <span class="home__terminal-dot home__terminal-dot--yellow"></span>
            <span class="home__terminal-dot home__terminal-dot--green"></span>
            <span class="home__terminal-label">ishita@portfolio:~</span>
         </div>

         <div class="home__terminal-body status-page__body">
            <p class="home__terminal-line">
               <span class="home__prompt">$</span>
               <span>send --message</span>
            </p>
            <p class="status-page__error" style="color: var(--first-color);">
               ✓ 200 OK — delivered
            </p>

            <div class="status-page__icon"><i class="ri-mail-send-line"></i></div>
            <h1 class="status-page__title">Message sent!</h1>
            <p class="status-page__message">
               Thanks for reaching out — I've got your message and will get back to you soon.
            </p>

            <div class="status-page__buttons">
               <a href="index.html" class="button">
                  <i class="ri-home-4-line"></i> Back to Home
               </a>
               <a href="index.html#work" class="button button--ghost">
                  <i class="ri-code-s-slash-line"></i> See my work
               </a>
            </div>
         </div>
      </div>

      <div class="blob-big"></div>
      <div class="blob-small"></div>
   </main>
</body>
</html>
